<body>

<style>
/* Layout: one narrow widget column (board first, like a printed game card); at ≥760px board left, story + score sheet right. */
:root{
  --bg:#f7f6f2; --surface:#fffefb; --line:#e3e0d7; --fg:#2b2a26; --muted:#7b776c; --soft:#a6a297;
  --accent:#58654f; --accent-fg:#f7f6f2; --accent-soft:#e3e7dc; --danger:#c2453d;
  --f-display:"Newsreader","Iowan Old Style","Georgia",serif;
  --f-ui:"Public Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-fig:"Noto Sans Symbols 2","Segoe UI Symbol","Apple Symbols",sans-serif;
  --sq-l:#e9dcc0; --sq-d:#8b6c50; --hl:rgba(232,200,110,.55); --frame:#e6dcc6;
  --anim:220ms; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1c19; --surface:#232420; --line:#33352f; --fg:#e8e6df; --muted:#9d9a8f; --soft:#6d6b63;
  --accent:#a3b394; --accent-fg:#1b1c19; --accent-soft:#2e3429; --danger:#e0675e; --frame:#2c2d28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1c19; --surface:#232420; --line:#33352f; --fg:#e8e6df; --muted:#9d9a8f; --soft:#6d6b63;
  --accent:#a3b394; --accent-fg:#1b1c19; --accent-soft:#2e3429; --danger:#e0675e; --frame:#2c2d28; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:1060px;margin:0 auto;display:grid;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px}
.tbtn{height:36px;min-width:36px;padding:0 8px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);transition:background .15s,color .15s}
.tbtn:hover{background:var(--accent-soft);color:var(--fg)}
.tbtn svg{width:21px;height:21px}
.tbtn .lbl{font-size:14px}
.layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);grid-template-areas:"hdr" "board" "rest"}
.hdrbox,.rest,.boardcol{display:grid;gap:16px;align-content:start;min-width:0}
.hdrbox{grid-area:hdr}.boardcol{grid-area:board}.rest{grid-area:rest}
.hdr{display:grid;gap:6px}
.hdr h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5.4vw,36px);line-height:1.12;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hdr h1 .dash{color:var(--soft)}
.meta{color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;align-items:baseline}
.meta .gname{font-family:var(--f-display);font-style:italic;font-size:17px;color:var(--fg)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:13.5px}
.banner button{font-weight:600;color:var(--accent);white-space:nowrap}
/* board */
.boardwrap{background:var(--frame);border-radius:10px;padding:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.board{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:3px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sqs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative;background:var(--sq-l)}
.sq.d{background:var(--sq-d)}
.sq.hl::after{content:"";position:absolute;inset:0;background:var(--hl);box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(230,40,30,.85) 0%,rgba(230,40,30,.45) 38%,rgba(230,40,30,0) 70%);z-index:1}
.co{position:absolute;font-size:clamp(8px,1.9vw,12px);font-weight:600;line-height:1;z-index:2;pointer-events:none;opacity:.9}
.co.r{left:4%;top:5%}.co.f{right:5%;bottom:4%}
.sq .co{color:var(--sq-d)}.sq.d .co{color:var(--sq-l)}
.board.nocoords .co{display:none}
.pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;background-size:88%;background-repeat:no-repeat;background-position:center;
  transition:transform var(--anim) var(--ease),opacity var(--anim) ease;will-change:transform;z-index:3}
.pc.mv{z-index:5}
.pc.out{opacity:0}
.pc.new{opacity:0}
/* ===== Pixel theme: the whole card becomes a 16-bit game screen ===== */
:root.t-pixel-ui{
  --bg:#f2e8cf; --surface:#fff8e6; --line:#2a1d2e; --fg:#2a1d2e; --muted:#6b5546; --soft:#a8907a;
  --accent:#3e8948; --accent-fg:#fff8e6; --accent-soft:#e3d4ae; --danger:#c8392b;
  --f-display:"Pixelify Sans","Silkscreen",ui-monospace,monospace; --f-ui:"Silkscreen",ui-monospace,monospace;
  --px-shadow:#2a1d2e; --px-gold:#f2c14e}
@media (prefers-color-scheme:dark){:root.t-pixel-ui:not([data-theme="light"]){
  --bg:#1a1c2c; --surface:#262b44; --line:#0d0e17; --fg:#f4f4f4; --muted:#94b0c2; --soft:#566c86;
  --accent:#38b764; --accent-fg:#0d0e17; --accent-soft:#333c57; --danger:#ef5a4a; --px-shadow:#0d0e17;color-scheme:dark}}
:root.t-pixel-ui[data-theme="dark"]{
  --bg:#1a1c2c; --surface:#262b44; --line:#0d0e17; --fg:#f4f4f4; --muted:#94b0c2; --soft:#566c86;
  --accent:#38b764; --accent-fg:#0d0e17; --accent-soft:#333c57; --danger:#ef5a4a; --px-shadow:#0d0e17;color-scheme:dark}
.t-pixel-ui body{font-size:13px;letter-spacing:.02em;-webkit-font-smoothing:none;font-smooth:never}
.t-pixel-ui .eyebrow{font-size:12px;letter-spacing:.12em}
.t-pixel-ui .hdr h1{font-weight:500;font-size:clamp(24px,5vw,32px);line-height:1.15;letter-spacing:0}
.t-pixel-ui .hdr h1 .dash{color:var(--px-gold)}
.t-pixel-ui .meta{font-size:12px}
.t-pixel-ui .meta .gname{font-family:var(--f-display);font-style:normal;font-size:16px;color:var(--accent)}
.t-pixel-ui .story{font-size:17px;line-height:1.6}
.t-pixel-ui .tbtn{border-radius:0;color:var(--fg)}
.t-pixel-ui .tbtn:hover{background:var(--accent-soft)}
.t-pixel-ui #bArchive{border:2px solid var(--line);box-shadow:3px 3px 0 var(--px-shadow);height:32px;padding:0 10px;margin-right:6px}
.t-pixel-ui #bArchive:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--px-shadow)}
.t-pixel-ui .tbtn .lbl{font-size:12px}
.t-pixel-ui .banner{border-radius:0;border:2px solid var(--line);box-shadow:3px 3px 0 var(--px-shadow);font-size:11.5px}
.t-pixel-ui .rule{height:0;border-top:2px dashed var(--soft);background:none}
.t-pixel-ui details.moves>summary{font-size:14px}
.t-pixel-ui .res{font-family:var(--f-ui)}
.t-pixel-ui .mlist{font-size:12.5px;border-top:2px solid var(--line)}
.t-pixel-ui .mlist button{border-radius:0}
.t-pixel-ui .mlist button.cur{background:var(--accent);color:var(--accent-fg);box-shadow:2px 2px 0 var(--px-shadow)}
.t-pixel-ui .mlist button.key:not(.cur){box-shadow:inset 3px 0 0 var(--danger)}
.t-pixel-ui .foot{font-size:11.5px}
.t-pixel-ui .status{font-size:13px}
.t-pixel-ui .mvl::after{content:"_";margin-left:2px;animation:pxblink 1s steps(1) infinite}
@keyframes pxblink{50%{opacity:0}}
.t-pixel-ui .figs{font-family:var(--f-fig)}
/* chunky controls */
.t-pixel-ui .cbtn{border-radius:0;width:44px;height:44px}
.t-pixel-ui .cbtn:not(.play){border:2px solid var(--line);background:var(--surface);box-shadow:3px 3px 0 var(--px-shadow)}
.t-pixel-ui .cbtn:not(.play):hover{background:var(--accent-soft)}
.t-pixel-ui .cbtn:active{transform:translate(2px,2px)}
.t-pixel-ui .cbtn:not(.play):active{box-shadow:1px 1px 0 var(--px-shadow)}
.t-pixel-ui .cbtn svg{shape-rendering:crispEdges}
.t-pixel-ui .cbtn.play{width:60px;height:60px;margin:0 6px;background:var(--accent);
  box-shadow:0 -4px 0 var(--line),0 4px 0 var(--line),-4px 0 0 var(--line),4px 0 0 var(--line),0 8px 0 var(--px-shadow),4px 4px 0 var(--px-shadow),-4px 4px 0 var(--line),4px 0 0 var(--line)}
.t-pixel-ui .cbtn.play:hover{filter:none;background:color-mix(in srgb,var(--accent) 85%,#fff)}
.t-pixel-ui .keybtn{border-radius:0;font-size:11.5px}
.t-pixel-ui .keybtn i{border-radius:0;width:8px;height:8px}
/* slider: segmented health bar */
.t-pixel-ui .scrub input::-webkit-slider-runnable-track{height:12px;border-radius:0;border:2px solid var(--line);
  background:repeating-linear-gradient(90deg,transparent 0 6px,var(--line) 6px 8px) 0 0/100% 100%,linear-gradient(var(--accent),var(--accent)) 0/var(--p,0%) 100% no-repeat,var(--surface)}
.t-pixel-ui .scrub input::-moz-range-track{height:8px;border-radius:0;border:2px solid var(--line);background:var(--surface)}
.t-pixel-ui .scrub input::-moz-range-progress{height:8px;border-radius:0;background:var(--accent)}
.t-pixel-ui .scrub input::-webkit-slider-thumb{width:14px;height:22px;border-radius:0;margin-top:-7px;background:var(--px-gold);border:2px solid var(--line);box-shadow:2px 2px 0 var(--px-shadow)}
.t-pixel-ui .scrub input::-moz-range-thumb{width:10px;height:18px;border-radius:0;background:var(--px-gold);border:2px solid var(--line)}
.t-pixel-ui .tick{top:-6px;width:4px;height:4px;border-radius:0;transform:translateX(-2px)}
.t-pixel-ui .tb{border-radius:0;box-shadow:inset 0 0 0 2px var(--soft)}
.t-pixel-ui .tb.on{box-shadow:inset 0 0 0 2px var(--fg),3px 3px 0 var(--accent);transform:none}
.t-pixel-ui .tb:not(.on){transform:none;opacity:.35}
/* sheets */
.t-pixel-ui .sheet{border-left:3px solid var(--line);box-shadow:-6px 0 0 rgba(0,0,0,.18)}
.t-pixel-ui .sh-h{border-bottom:2px solid var(--line)}
.t-pixel-ui .sh-h h2{font-size:22px}
.t-pixel-ui .grp>.gl,.t-pixel-ui .arc-month{font-size:11px;letter-spacing:.1em}
.t-pixel-ui .sw,.t-pixel-ui .sw .chk,.t-pixel-ui .seg,.t-pixel-ui .seg button,.t-pixel-ui .arc-search,.t-pixel-ui .arow,.t-pixel-ui .mini{border-radius:0}
.t-pixel-ui .sw[aria-pressed="true"]{border:2px solid var(--line);box-shadow:3px 3px 0 var(--px-shadow)}
.t-pixel-ui .seg{border:2px solid var(--line)}
.t-pixel-ui .seg button{font-size:11.5px}
.t-pixel-ui .arc-search{border:2px solid var(--line)}
.t-pixel-ui .arow .t b{font-family:var(--f-display);font-size:15px}
.t-pixel-ui .arow .t span,.t-pixel-ui .arow .d{font-size:11px}
.t-pixel-ui .today-pill{border-radius:0;font-size:9.5px}
.t-pixel-ui .sw-t,.t-pixel-ui .sw-t::after{border-radius:0}
.t-pixel-ui .sw-t{border:2px solid var(--line);height:22px}
.t-pixel-ui .sw-t::after{top:2px;left:2px;width:14px;height:14px;background:var(--line);box-shadow:none}
.t-pixel-ui .info code,.t-pixel-ui .kbd{border-radius:0}
.t-pixel-ui ::selection{background:var(--px-gold);color:#2a1d2e}
/* pixel board: the frame and tiles are one generated bitmap */
.boardwrap.t-pixel{border-radius:0;padding:calc(100% * 12 / 184);background:var(--px-board) 0 0/100% 100% no-repeat;image-rendering:pixelated;
  box-shadow:6px 6px 0 rgba(0,0,0,.22)}
.board.t-pixel{border-radius:0;image-rendering:pixelated}
.board.t-pixel .sq,.board.t-pixel .sq.d{background:none}
.board.t-pixel .co{display:none}
.board.t-pixel .pc{background-size:100%;image-rendering:pixelated;transition-timing-function:steps(6,end),steps(3,end)}
.board.t-pixel .sq.hl::after{background:var(--px-hl) 0 0/100% 100%,rgba(255,214,64,.22);box-shadow:none;image-rendering:pixelated}
.board.t-pixel .sq.chk::before{background:var(--px-chk) 0 0/100% 100%,rgba(232,64,47,.35);image-rendering:pixelated;animation:pxblink .8s steps(1) 3}
.poof{position:absolute;width:12.5%;height:12.5%;left:0;top:0;z-index:6;pointer-events:none;background:var(--px-poof) 0 0/100% 100%;image-rendering:pixelated;
  animation:poof .42s steps(4,end) forwards}
@keyframes poof{0%{opacity:1;scale:.5}100%{opacity:0;scale:1.5}}
/* ===== Spezialität picker ===== */
.spc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.spc{display:grid;gap:8px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.spc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.spc .pv{position:relative;aspect-ratio:16/10;border-radius:7px;overflow:hidden;background-size:200% auto;background-position:0 0}
.spc .pv img{position:absolute;bottom:10%;height:56%;width:auto;image-rendering:pixelated}
.spc b{font-weight:600;font-size:14px;display:block}
.spc span.d{font-size:12px;color:var(--muted);display:block}
.t-pixel-ui .spc,.t-pixel-ui .spc .pv{border-radius:0}
/* ===== Cyberpunk theme: neon HUD, always dark ===== */
:root.t-cyber-ui.t-cyber-ui{
  --bg:#07060f; --surface:#100e20; --line:#2b2650; --fg:#e8f9ff; --muted:#8b8fb8; --soft:#4f4d78;
  --accent:#00f0ff; --accent-fg:#07060f; --accent-soft:rgba(0,240,255,.12); --danger:#ff2a6d;
  --cy-mag:#ff2a6d; --cy-yel:#fcee0a; --cy-cyan:#00f0ff;
  --f-display:"Orbitron","Chakra Petch",ui-sans-serif,sans-serif; --f-ui:"Chakra Petch",ui-sans-serif,system-ui,sans-serif; --f-mono:"Share Tech Mono",ui-monospace,monospace;
  color-scheme:dark}
.t-cyber-ui body{background:radial-gradient(900px 500px at 100% 0,rgba(255,42,109,.13),transparent 60%),radial-gradient(800px 500px at 0 100%,rgba(0,240,255,.10),transparent 60%),var(--bg);background-attachment:fixed;min-height:100%}
.t-cyber-ui body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.t-cyber-ui .eyebrow{font-family:var(--f-mono);color:var(--cy-cyan);letter-spacing:.18em;text-shadow:0 0 8px rgba(0,240,255,.6)}
.t-cyber-ui .eyebrow::before{content:"// ";color:var(--cy-mag)}
.t-cyber-ui .hdr h1{font-weight:700;text-transform:uppercase;font-size:clamp(20px,4.2vw,28px);letter-spacing:.04em;line-height:1.25;text-shadow:-1.5px 0 rgba(255,42,109,.75),1.5px 0 rgba(0,240,255,.75)}
.t-cyber-ui .hdr h1 .dash{color:var(--cy-yel);text-shadow:0 0 10px var(--cy-yel)}
.t-cyber-ui .hdr h1.glitch{animation:cyglitch .55s steps(2,end) 1}
@keyframes cyglitch{0%{clip-path:inset(0 0 60% 0);transform:translate(-4px,0)}20%{clip-path:inset(40% 0 20% 0);transform:translate(4px,0)}40%{clip-path:inset(70% 0 0 0);transform:translate(-2px,0)}60%{clip-path:inset(10% 0 70% 0);transform:translate(3px,0)}80%{clip-path:inset(0);transform:translate(-1px,0)}100%{clip-path:inset(0);transform:none}}
.t-cyber-ui .meta{font-family:var(--f-mono);font-size:13.5px}
.t-cyber-ui .meta .gname{font-family:var(--f-mono);font-style:normal;font-size:15px;color:var(--cy-yel);text-shadow:0 0 8px rgba(252,238,10,.45)}
.t-cyber-ui .story{font-family:var(--f-ui);font-size:16.5px;line-height:1.6;color:#cfe9f2;border-left:2px solid var(--cy-mag);padding-left:14px}
.t-cyber-ui .tbtn{border-radius:0;color:var(--cy-cyan)}
.t-cyber-ui .tbtn:hover{background:rgba(0,240,255,.1);box-shadow:0 0 12px rgba(0,240,255,.35)}
.t-cyber-ui #bArchive{border:1px solid var(--cy-cyan);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.1em;margin-right:6px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.t-cyber-ui .banner{border-radius:0;border:1px solid var(--cy-mag);background:rgba(255,42,109,.08);font-family:var(--f-mono)}
.t-cyber-ui .banner button{color:var(--cy-mag)}
.t-cyber-ui .rule{background:linear-gradient(90deg,var(--cy-mag),var(--cy-cyan) 40%,transparent);opacity:.6}
.t-cyber-ui details.moves>summary{font-family:var(--f-display);font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.t-cyber-ui .res{font-family:var(--f-mono);color:var(--cy-yel)}
.t-cyber-ui .mlist{font-family:var(--f-mono);font-size:14px;border-top:1px solid var(--line)}
.t-cyber-ui .mlist button{border-radius:0}
.t-cyber-ui .mlist button.cur{background:var(--cy-cyan);color:#07060f;box-shadow:0 0 14px rgba(0,240,255,.55)}
.t-cyber-ui .mlist button.key:not(.cur){box-shadow:inset 2px 0 0 var(--cy-mag);color:var(--cy-mag)}
.t-cyber-ui .foot{font-family:var(--f-mono)}
.t-cyber-ui .foot button{color:var(--cy-cyan)}
.t-cyber-ui .status{font-family:var(--f-mono);font-size:15px}
.t-cyber-ui .mvl{color:var(--cy-cyan);text-shadow:0 0 8px rgba(0,240,255,.5)}
.t-cyber-ui .mvl::before{content:"> ";color:var(--cy-mag)}
.t-cyber-ui .mvl::after{content:"▌";margin-left:3px;animation:pxblink 1s steps(1) infinite;color:var(--cy-cyan)}
.t-cyber-ui .cbtn{border-radius:0;color:var(--cy-cyan);border:1px solid rgba(0,240,255,.45);background:rgba(0,240,255,.05)}
.t-cyber-ui .cbtn:hover{background:rgba(0,240,255,.14);box-shadow:0 0 16px rgba(0,240,255,.45)}
.t-cyber-ui .cbtn.play{border:0;background:var(--cy-yel);color:#07060f;width:70px;height:62px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.t-cyber-ui .cbtn.play:hover{background:#fff35a;filter:none;box-shadow:none}
.t-cyber-ui .keybtn{border-radius:0;font-family:var(--f-mono);color:var(--cy-mag)}
.t-cyber-ui .keybtn i{border-radius:0;background:var(--cy-mag);box-shadow:0 0 8px var(--cy-mag);transform:rotate(45deg)}
.t-cyber-ui .scrub input::-webkit-slider-runnable-track{height:4px;border-radius:0;background:linear-gradient(90deg,var(--cy-mag),var(--cy-cyan)) 0/var(--p,0%) 100% no-repeat,#211d40;box-shadow:0 0 10px rgba(0,240,255,.25)}

  for(const p of pool){if(dur){p.el.classList.add("out");setTimeout(()=>p.el.remove(),dur+60);}else p.el.remove();}
  // moved pieces
  if(BOARDS[S.board].cyber&&dur)for(const p of moved){const e=p.el;setTimeout(()=>{e.classList.remove("arrive");e.offsetWidth;e.classList.add("arrive");},dur);}
  for(const p of moved){p.el.classList.add("mv");if(!dur)p.el.style.transition="none";place(p.el,p.sq);if(!dur){p.el.offsetWidth;p.el.style.transition="";}setTimeout(()=>p.el.classList.remove("mv"),dur+20);}
  // new pieces (promotions forward, or captured pieces returning when stepping back)
  const born=[];
  for(const sq in need){const el=mkPiece(need[sq],sq);if(dur){el.classList.add("new");born.push(el);}keep.push({el,code:need[sq],sq});}
  if(born.length)requestAnimationFrame(()=>requestAnimationFrame(()=>born.forEach(e=>e.classList.remove("new"))));
  live=keep.concat(moved);
}
function relayout(){for(const p of live){p.el.style.transition="transform 380ms cubic-bezier(.2,.8,.2,1)";place(p.el,p.sq);setTimeout(()=>p.el.style.transition="",400);}}

/* ---------- pieces + board theme ---------- */
function applyLook(){
  const b=BOARDS[S.board],r=document.documentElement.style;
  r.setProperty("--sq-l",b.l);r.setProperty("--sq-d",b.d);r.setProperty("--hl",b.h);
  boardEl.classList.toggle("t-pixel",!!b.pix);boardEl.parentElement.classList.toggle("t-pixel",!!b.pix);
  document.documentElement.classList.toggle("t-pixel-ui",!!b.pix);
  boardEl.classList.toggle("t-cyber",!!b.cyber);boardEl.parentElement.classList.toggle("t-cyber",!!b.cyber);
  document.documentElement.classList.toggle("t-cyber-ui",!!b.cyber);
  if(b.cyber)r.setProperty("--cy-board",cyberBoard(!!S.flip).board);
  if(b.pix){r.setProperty("--px-board",`url(${pixelBoard(!!S.flip).board})`);r.setProperty("--px-hl",PX_HL);r.setProperty("--px-chk",PX_CHK);r.setProperty("--px-poof",PX_POOF);}
  r.setProperty("--anim",SPEEDS[S.speed]+"ms");
  const set=PIECES[S.pieces];let css="";for(const k in set)css+=`.p-${k}{background-image:url("${set[k]}")}`;
  $("pieceCss").textContent=css;
  boardEl.classList.toggle("nocoords",!S.coords);
  if(S.theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",S.theme);
}

/* ---------- notation ---------- */
const FIG={K:"♚",Q:"♛",R:"♜",B:"♝",N:"♞"},TRL={K:"Ş",Q:"V",R:"K",B:"F",N:"A"};
function fmt(san){
  if(S.notation==="fig")return san.replace(/[KQRBN]/g,c=>`<span class="figs">${FIG[c]}</span>`);
  if(S.lang==="tr")return san.replace(/[KQRBN]/g,c=>TRL[c]);
  return san;
}
const moveNo=i=>Math.floor(i/2)+1+(i%2?"…":".");

/* ---------- viewer state ---------- */
let G=null,ply=0,viewIdx=todayIdx,timer=null;
function sideName(full){const parts=full.split(" ");return parts.length>1&&!/&|Blue/.test(full)?parts[parts.length-1]:full;}
function loadGame(idx,opts={}){
  viewIdx=idx;G=gameFor(idx);stop();
  const d=dateOf(idx),l=L();
  $("title").innerHTML=`${esc(G.w)} <span class="dash">—</span> ${esc(G.b)}`;
  const h1=$("title");h1.classList.remove("glitch");h1.offsetWidth;h1.classList.add("glitch");
  $("where").textContent=`${G.ev} · ${G.yr}`;
  $("gname").textContent=G.name;
  $("gdate").textContent=`${d.d} ${MONTHS[S.lang][d.m]}`;
  $("story").textContent=G.note[S.lang];
  $("result").textContent=G.res.replace("-","–");
  $("banner").hidden=idx===todayIdx;
  $("bannerTxt").textContent=`${l.fromArc} · ${d.d} ${MONTHS[S.lang][d.m]} ${d.y}`;
  $("bToday").textContent=l.backToday;
  const sc=$("scrub");sc.max=G.mv.length;
  $("ticks").innerHTML=`<span class="tick" style="left:calc(11px + (100% - 22px) * ${G.key/G.mv.length})"></span>`;
  buildMoveList();
  pcsEl.innerHTML="";live=[];
  const start=opts.ply!=null?opts.ply:S.openAt==="end"?G.mv.length:S.openAt==="key"?G.key:0;
  go(start,true);
  try{history.replaceState(null,"",idx===todayIdx?location.pathname+location.search:"#"+G.id);}catch(e){}
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function buildMoveList(){
  const m=$("mlist");let h="";
  for(let i=0;i<G.mv.length;i+=2){
    h+=`<span class="n">${i/2+1}.</span>`;
    for(const j of [i,i+1]){if(j<G.mv.length)h+=`<button data-p="${j+1}" class="${j+1===G.key?"key":""}">${fmt(G.mv[j][2])}</button>`;else h+="<span></span>";}
  }
  m.innerHTML=h;
}
function go(p,instant){
  p=Math.max(0,Math.min(G.mv.length,p));
  const prev=ply;ply=p;
  const hint=(p===prev+1)?{from:G.mv[p-1][0],to:G.mv[p-1][1]}:null;
  setPosition(G.pos[p],hint,instant);
  // highlights
  for(const k in sqEls)sqEls[k].classList.remove("hl","chk");
  if(p>0){const [f,t,san]=G.mv[p-1];if(S.hl){sqEls[f].classList.add("hl");sqEls[t].classList.add("hl");}
    if(/[+#]/.test(san)){const turn=p%2===1?"b":"w";const pl=parsePlacement(G.pos[p]);const ks=Object.keys(pl).find(s=>pl[s]===turn+"K");ks&&sqEls[ks].classList.add("chk");}
    if(!instant&&hint)sound(san.includes("x"));}
  const l=L();
  $("mvl").innerHTML=p?`${moveNo(p-1)} ${fmt(G.mv[p-1][2])}`:esc(l.start);
  const end=p===G.mv.length;const last=p?G.mv[p-1][2]:"";
  const stm=$("stm");
  if(end){stm.removeAttribute("aria-label");stm.textContent=last.endsWith("#")?l.mate:G.res==="1-0"?l.resigns(sideName(G.b)):G.res==="0-1"?l.resigns(sideName(G.w)):"½–½";}
  else{const bt=p%2===1;if(!stm.querySelector(".turn"))stm.innerHTML='<span class="turn"><i class="tb w"></i><i class="tb b"></i></span>';
    stm.querySelector(".tb.w").classList.toggle("on",!bt);stm.querySelector(".tb.b").classList.toggle("on",bt);
    stm.setAttribute("aria-label",bt?l.btm:l.wtm);stm.title=bt?l.btm:l.wtm;}
  const sc=$("scrub");sc.value=p;sc.style.setProperty("--p",(p/G.mv.length*100)+"%");
  const m=$("mlist");m.querySelectorAll(".cur").forEach(b=>b.classList.remove("cur"));
  const cur=m.querySelector(`[data-p="${p}"]`);
  if(cur){cur.classList.add("cur");const top=cur.offsetTop-m.offsetTop,bt=top+cur.offsetHeight;if(top<m.scrollTop+30||bt>m.scrollTop+m.clientHeight-30)m.scrollTo({top:top-m.clientHeight/2,behavior:SPEEDS[S.speed]?"smooth":"auto"});}
  else if(p===0)m.scrollTop=0;
}
function play(){if(ply>=G.mv.length)go(0,true);timer=setInterval(()=>{if(ply>=G.mv.length){stop();return;}go(ply+1);},DELAYS[S.delay]);setPlayIcon(true);}
function stop(){clearInterval(timer);timer=null;setPlayIcon(false);}
function setPlayIcon(on){$("playIco").innerHTML=on?'<rect x="6" y="5" width="4.2" height="14" rx="1.2" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2" fill="currentColor"/>':'<path d="M7 4.5v15l13-7.5z" fill="currentColor"/>';$("bPlay").setAttribute("aria-label",on?"Pause":"Play");}

/* ---------- sound (synthesised, starts only after a click) ---------- */
let AC=null;
function sound(cap){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,len=.07;
  const buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6);
  const src=AC.createBufferSource();src.buffer=buf;const bp=AC.createBiquadFilter();bp.type="bandpass";bp.frequency.value=cap?900:1500;bp.Q.value=2.2;
  const g=AC.createGain();g.gain.value=cap?1.1:.7;src.connect(bp).connect(g).connect(AC.destination);src.start(t);}catch(e){}}

/* ---------- archive ---------- */
function miniBoard(code){
  const b=BOARDS[S.board];const pl=parsePlacement(code);
  let h=b.cyber?`<div class="mini" style="background:${cyberBoard(false).squares} 0 0/100% 100%">`:b.pix?`<div class="mini" style="background:url(${pixelBoard(false).squares}) 0 0/100% 100%;image-rendering:pixelated">`:`<div class="mini" style="background:repeating-conic-gradient(${b.d} 0 25%,${b.l} 0 50%) 0 0/25% 25%">`;
  for(const sq in pl){const f=FILES.indexOf(sq[0]),r=+sq[1];const x=S.flip?7-f:f,y=S.flip?r-1:8-r;h+=`<div class="pc p-${pl[sq]}" style="transform:translate(${x*100}%,${y*100}%)"></div>`;}
  return h+"</div>";
}
function renderArchive(){
  const q=$("arcSearch").value.trim().toLowerCase(),l=L();
  let h="",lastM=null;
  for(let i=todayIdx;i>=0;i--){
    const g=gameFor(i),d=dateOf(i);
    const hay=`${g.w} ${g.b} ${g.ev} ${g.yr} ${g.name}`.toLowerCase();
    if(q&&!hay.includes(q))continue;
    const mk=d.y*12+d.m;if(mk!==lastM){h+=`<div class="arc-month">${MONTHS_L[S.lang][d.m]} ${d.y}</div>`;lastM=mk;}
    h+=`<button class="arow${i===viewIdx?" cur":""}" data-i="${i}">${miniBoard(g.pos[g.key])}
      <span class="t"><b>${esc(sideName(g.w))} — ${esc(sideName(g.b))}</b><span>${esc(g.name)} · ${g.yr}</span></span>
      <span class="d">${i===todayIdx?`<span class="today-pill">${l.today}</span>`:`<span>${DOW[S.lang][d.w]} ${d.d}</span>`}<span class="res">${g.res.replace("-","–")}</span></span></button>`;
  }
  $("arcList").innerHTML=h||`<p style="color:var(--muted)">—</p>`;
}

/* ---------- settings sheet ---------- */
function seg(key,opts,labels){return `<div class="seg" role="group">${opts.map(o=>`<button data-k="${key}" data-v="${o}" aria-pressed="${S[key]===o}">${labels[o]}</button>`).join("")}</div>`;}
function tog(key,label){return `<button class="tog" role="switch" data-t="${key}" aria-checked="${S[key]}"><span>${label}</span><span class="sw-t"></span></button>`;}
function renderSettings(){
  const l=L();
  const boards=Object.entries(BOARDS).filter(([k,b])=>!b.special).map(([k,b])=>`<button class="sw" data-k="board" data-v="${k}" aria-pressed="${S.board===k}"><span class="chk"${b.pix?` style="background:url(${pixelBoard(false).squares}) 0 0/400% 400%;image-rendering:pixelated"`:""}>${b.pix?"":[b.l,b.d,b.d,b.l].map(c=>`<span style="background:${c}"></span>`).join("")}</span>${b.n}</button>`).join("");
  const bb=BOARDS[S.board];
  const spec=Object.entries(BOARDS).filter(([k,b])=>b.special).map(([k,b])=>{const bg=b.pix?`url(${pixelBoard(false).squares});image-rendering:pixelated`:cyberBoard(false).squares;const ps=PIECES[b.special];
    return `<button class="spc" data-k="special" data-v="${k}" aria-pressed="${S.board===k}"><span class="pv" style="background:${bg} 0 0/200% auto"><img alt="" src="${ps.wK}" style="left:8%"><img alt="" src="${ps.bN}" style="left:39%"><img alt="" src="${ps.wQ}" style="left:70%"></span><span><b>${b.n}</b><span class="d">${l.specDesc[k]}</span></span></button>`;}).join("");
  const pcs=Object.keys(PIECES).map(k=>`<button class="sw" data-k="pieces" data-v="${k}" aria-pressed="${S.pieces===k}"><span class="chk" style="grid-template-columns:1fr;image-rendering:pixelated"><span style="background:${bb.l}"></span><img alt="" src="${PIECES[k].wN}" style="inset:2% 50% 2% 0;width:50%;height:96%;object-fit:contain"><img alt="" src="${PIECES[k].bQ}" style="inset:2% 0 2% 50%;left:50%;width:50%;height:96%;object-fit:contain"></span>${SETNAMES[k]}</button>`).join("");
  $("setBody").innerHTML=`
   <div class="grp"><div class="gl">Spezialität</div><div class="spc-grid">${spec}</div></div>
   <div class="grp"><div class="gl">${l.board}</div><div class="swatches">${boards}</div></div>
   <div class="grp"><div class="gl">${l.pieces}</div><div class="swatches">${pcs}</div></div>
   <div class="grp"><div class="gl">${l.speed}</div>${seg("speed",["off","fast","normal","slow"],l.sp)}</div>
   <div class="grp"><div class="gl">${l.delay}</div>${seg("delay",["0.6","1.2","2","3.5"],{"0.6":"0.6s","1.2":"1.2s","2":"2s","3.5":"3.5s"})}</div>
   <div class="grp"><div class="gl">${l.openAt}</div>${seg("openAt",["start","key","end"],l.oa)}</div>
   <div class="grp"><div class="gl">${l.notation}</div>${seg("notation",["fig","let"],l.nt)}</div>
   <div class="grp"><div class="gl">${l.theme}</div>${seg("theme",["auto","light","dark"],l.th)}</div>
   <div class="grp"><div class="gl">${l.lang}</div>${seg("lang",["en","tr"],{en:"English",tr:"Türkçe"})}</div>
   <div class="grp">${tog("coords",l.coords)}${tog("hl",l.hl)}${tog("sound",l.sound)}</div>
   <p class="credits">Piece sets from the lichess project: Classic by Colin M.L. Burnett (GPLv2+), Merida by Armando Hernandez Marroquin (GPLv2+), Chessnut by Alexis Luengas (Apache 2.0), Fantasy, Celtic and Spatial by Maurizio Monge (MIT), Shapes by flugsio (CC BY-SA 4.0). The Pixel and Cyberpunk sets and boards were drawn for this page.</p>`;
}
$("setBody").addEventListener("click",e=>{
  const b=e.target.closest("[data-k],[data-t]");if(!b)return;
  if(b.dataset.t){S[b.dataset.t]=!S[b.dataset.t];}else if(b.dataset.k==="special"){S.board=b.dataset.v;S.pieces=BOARDS[b.dataset.v].special;}else{S[b.dataset.k]=b.dataset.v;if(b.dataset.k==="board"&&BOARDS[S.board].special===undefined&&(S.pieces==="pixel8"||S.pieces==="cyber"))S.pieces="cburnett";}
  save();applyLook();
  const k=b.dataset.k||b.dataset.t;
  if(k==="lang"||k==="notation"){applyText();loadGame(viewIdx,{ply});}
  else if(k==="hl"||k==="speed"){go(ply,true);}
  const sc=$("setBody").scrollTop;renderSettings();$("setBody").scrollTop=sc;
});

/* ---------- text ---------- */
function applyText(){
  const l=L();document.documentElement.lang=S.lang;
  $("eyebrow").textContent=l.eyebrow;$("lArchive").textContent=l.archive;$("hArchive").textContent=l.archive;
  $("hSettings").textContent=l.settings;$("hInfo").textContent=l.info;$("bInfo").textContent=l.info;
  $("lMoves").textContent=l.moves;$("lFoot").textContent=l.foot;$("lKey").textContent=l.key;
  $("arcSearch").placeholder=l.search;
  $("infoBody").innerHTML=l.infoHtml+`<p class="credits">${l.shown(todayIdx+1)}.</p>`;
}

/* ---------- sheets ---------- */
let openSheet=null;
function show(id){hide();openSheet=$(id);openSheet.classList.add("on");$("scrim").classList.add("on");const f=openSheet.querySelector("[data-close]");f&&f.focus({preventScroll:true});}
function hide(){if(openSheet){openSheet.classList.remove("on");openSheet=null;}$("scrim").classList.remove("on");}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=hide);
$("scrim").onclick=hide;

/* ---------- events ---------- */
$("bFirst").onclick=()=>{stop();go(0);};
$("bPrev").onclick=()=>{stop();go(ply-1);};
$("bNext").onclick=()=>{stop();go(ply+1);};
$("bLast").onclick=()=>{stop();go(G.mv.length);};
$("bPlay").onclick=()=>timer?stop():play();
$("bKey").onclick=()=>{stop();go(G.key);};
$("scrub").oninput=e=>{stop();go(+e.target.value);};
$("mlist").onclick=e=>{const b=e.target.closest("[data-p]");if(b){stop();go(+b.dataset.p);}};
$("bFlip").onclick=()=>{S.flip=!S.flip;save();applyLook();buildSquares();relayout();go(ply,true);};
$("bArchive").onclick=()=>{renderArchive();show("shArchive");};
$("bSettings").onclick=()=>{renderSettings();show("shSettings");};
$("bInfo").onclick=()=>show("shInfo");
$("bToday").onclick=()=>loadGame(todayIdx);
$("arcSearch").oninput=renderArchive;
$("arcList").onclick=e=>{const b=e.target.closest("[data-i]");if(b){loadGame(+b.dataset.i);hide();}};
document.addEventListener("keydown",e=>{
  if(e.target.matches("input[type=search]"))return;
  if(e.key==="Escape"){hide();return;}
  if(openSheet)return;
  const k=e.key;
  if(k==="ArrowRight"){stop();go(ply+1);}else if(k==="ArrowLeft"){stop();go(ply-1);}
  else if(k==="Home"){stop();go(0);}else if(k==="End"){stop();go(G.mv.length);}
  else if(k===" "&&!e.target.closest("button,summary")){timer?stop():play();}
  else if(k==="f"||k==="F")$("bFlip").click();else if(k==="k"||k==="K")$("bKey").click();
  else return;
  e.preventDefault();
});
// swipe on the board to step
let tx=null;boardEl.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;},{passive:true});
boardEl.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>40){stop();go(ply+(dx<0?1:-1));}});
boardEl.addEventListener("click",()=>{stop();go(ply+1);});
// day rollover while the page stays open (e.g. a Notion tab left open overnight)
setInterval(()=>{const n=new Date();const i=dayNum(n.getFullYear(),n.getMonth(),n.getDate())-dayNum(...EPOCH);if(i!==todayIdx)location.reload();},60000);

/* ---------- boot ---------- */
applyLook();applyText();buildSquares();
const fromHash=location.hash.slice(1);
let startIdx=todayIdx;
if(fromHash){for(let i=todayIdx;i>=0;i--)if(gameFor(i).id===fromHash){startIdx=i;break;}}
if(matchMedia("(min-width:760px)").matches)$("movesBox").open=true;
loadGame(startIdx);
</script>

</body>
